name: Rinnova token Instagram

on:
  schedule:
    # Ogni domenica mattina. Il token dura 60 giorni e ogni rinnovo lo riporta a 60: anche con i ritardi
    # (o i run saltati) del cron GitHub il margine è enorme. Se il run fallisce diventa rosso e GitHub manda una mail.
    - cron: '23 6 * * 0'
  workflow_dispatch:

# Un solo rinnovo alla volta.
concurrency:
  group: rinnova-token-ig
  cancel-in-progress: false

jobs:
  rinnova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rinnova il token e salvalo su Dropbox
        env:
          DROPBOX_APP_KEY:       ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN:       ${{ secrets.IG_ACCESS_TOKEN }}
        run: node rinnova-token-ig.js
