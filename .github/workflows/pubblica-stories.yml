name: Pubblica stories giornaliere

on:
  # Lanciato SOLO dal timer esterno (Cloudflare Worker, timer-cloudflare/worker.js) via API ogni giorno alle 9:30 Europe/Rome,
  # oppure a mano. Il cron `schedule` di GitHub è stato tolto il 23/9/2026: partiva con ore di ritardo
  # e faceva solo run doppi. Se il timer si ferma, lanciare a mano da GitHub UI.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test a secco: logga le immagini che pubblicherebbe, senza toccare Instagram'
        type: boolean
        default: true
      force:
        description: 'Ignora il controllo orario (solo per test manuali)'
        type: boolean
        default: true
      rifai:
        description: 'Ripubblica SOLO questa story anche se oggi risulta già uscita (es. cancellata a mano da Instagram per correggerla)'
        type: choice
        options: [nessuna, pranzo, cena]
        default: nessuna

# Un solo run alla volta: timer esterno e lancio manuale non devono mai girare in parallelo
# (altrimenti entrambi vedrebbero "story non ancora pubblicata" e la pubblicherebbero due volte).
concurrency:
  group: pubblica-stories
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Serve solo alla grafica delle story (@napi-rs/canvas). Se l'installazione fallisce non blocca
      # niente: lo script ripiega sui JPG del menù semplici, meglio una story senza header che nessuna story.
      - name: Installa dipendenze grafica story
        continue-on-error: true
        run: npm ci --omit=dev
      - name: Pubblica stories del giorno
        env:
          DROPBOX_APP_KEY:        ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_REFRESH_TOKEN:  ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          IG_USER_ID:       ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:  ${{ secrets.IG_ACCESS_TOKEN }}
          # Cron (produzione): pubblica davvero. workflow_dispatch: rispetta l'input scelto.
          DRY_RUN:   ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          RIFAI:     ${{ github.event_name == 'workflow_dispatch' && inputs.rifai || 'nessuna' }}
        run: node pubblica-stories.js
