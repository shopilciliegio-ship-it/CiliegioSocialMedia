name: Pubblica stories giornaliere

on:
  schedule:
    # RISERVA. Il trigger principale è un timer esterno (cron-job.org) che lancia questo workflow via API
    # (workflow_dispatch) alle 9:30 Europe/Rome: il cron di GitHub è "best effort" e in pratica parte con ore
    # di ritardo. Qui restano due orari (ora legale/solare) su minuti non tondi; lo script pubblica solo
    # nella finestra 9:00–11:00 Europe/Rome e salta le story già uscite oggi (stories-log.json).
    - cron: '37 7 * * *'  # 09:37 Europe/Rome con CEST (ora legale, UTC+2)
    - cron: '37 8 * * *'  # 09:37 Europe/Rome con CET (ora solare, UTC+1)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test a secco: logga le immagini che pubblicherebbe, senza toccare Instagram'
        type: boolean
        default: true
      force:
        description: 'Ignora il controllo orario (solo per test manuali)'
        type: boolean
        default: true

# Un solo run alla volta: timer esterno e cron di riserva non devono mai girare in parallelo
# (altrimenti entrambi vedrebbero "story non ancora pubblicata" e la pubblicherebbero due volte).
concurrency:
  group: pubblica-stories
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Serve solo alla grafica delle story (@napi-rs/canvas). Se l'installazione fallisce non blocca
      # niente: lo script ripiega sui JPG del menù semplici, meglio una story senza header che nessuna story.
      - name: Installa dipendenze grafica story
        continue-on-error: true
        run: npm ci --omit=dev
      - name: Pubblica stories del giorno
        env:
          DROPBOX_APP_KEY:        ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_REFRESH_TOKEN:  ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          IG_USER_ID:       ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:  ${{ secrets.IG_ACCESS_TOKEN }}
          # Cron (produzione): pubblica davvero. workflow_dispatch: rispetta l'input scelto.
          DRY_RUN:   ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: node pubblica-stories.js
