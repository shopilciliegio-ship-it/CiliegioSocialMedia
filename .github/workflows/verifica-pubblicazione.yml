name: Controllo pubblicazione giornaliero

on:
  # Lanciato SOLO dal timer esterno (Cloudflare Worker, timer-cloudflare/worker.js) via API ogni giorno alle 10:30 Europe/Rome,
  # oppure a mano. Il cron `schedule` di GitHub è stato tolto il 23/9/2026: partiva con ore di ritardo
  # e faceva solo run doppi. Se il timer si ferma, lanciare a mano da GitHub UI.
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignora il controllo orario (solo per test manuali)'
        type: boolean
        default: true
      send_email:
        description: 'Invia davvero la mail di controllo (disattiva per provare senza spedire)'
        type: boolean
        default: true

# Un solo run alla volta: timer esterno e lancio manuale non devono mai girare in parallelo
# (altrimenti Luca riceverebbe due email di controllo lo stesso giorno).
concurrency:
  group: verifica-pubblicazione
  cancel-in-progress: false

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verifica pubblicazione e invia email di controllo
        env:
          DROPBOX_APP_KEY:       ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          BREVO_API_KEY:         ${{ secrets.BREVO_API_KEY }}
          FORCE_RUN:  ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          SEND_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.send_email || 'true' }}
        run: node verifica-pubblicazione.js
