name: Pubblica social del lunedì

on:
  schedule:
    # RISERVA. Il trigger principale è un timer esterno (cron-job.org) che lancia questo workflow via API
    # (workflow_dispatch) alle 9:00 Europe/Rome: il cron di GitHub è "best effort" e in pratica parte con ore
    # di ritardo. Qui restano due orari (ora legale/solare) su minuti non tondi, meno congestionati; lo script
    # pubblica solo nella finestra 9:00–11:00 Europe/Rome e mai due volte (status "published").
    - cron: '7 7 * * 1'  # 09:07 Europe/Rome con CEST (ora legale, UTC+2)
    - cron: '7 8 * * 1'  # 09:07 Europe/Rome con CET (ora solare, UTC+1)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test a secco: logga cosa pubblicherebbe, senza toccare Facebook/Instagram'
        type: boolean
        default: true
      force:
        description: 'Ignora il controllo giorno/ora (solo per test manuali)'
        type: boolean
        default: true
      fb_gia_pubblicato:
        description: 'Recupero: Facebook è già uscito (es. run finito male), non rifarlo e pubblica solo quel che manca'
        type: boolean
        default: false

# Un solo run alla volta: timer esterno e cron di riserva non devono mai girare in parallelo.
concurrency:
  group: pubblica-lunedi
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pubblica reminder della settimana
        env:
          DROPBOX_APP_KEY:        ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_REFRESH_TOKEN:  ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          FB_PAGE_ID:              ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN:   ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID:              ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:        ${{ secrets.IG_ACCESS_TOKEN }}
          # Cron (produzione): pubblica davvero. workflow_dispatch: rispetta l'input scelto.
          DRY_RUN:   ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          FB_GIA_PUBBLICATO: ${{ github.event_name == 'workflow_dispatch' && inputs.fb_gia_pubblicato || 'false' }}
        run: node pubblica-social.js
