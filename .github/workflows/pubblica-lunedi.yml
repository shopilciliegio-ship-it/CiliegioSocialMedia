name: Pubblica social del lunedì

on:
  # Lanciato SOLO dal timer esterno (Cloudflare Worker, timer-cloudflare/worker.js) via API il lunedì alle 9:00 Europe/Rome,
  # oppure a mano. Il cron `schedule` di GitHub è stato tolto il 23/9/2026: partiva con ore di ritardo
  # e faceva solo run doppi. Se il timer si ferma, lanciare a mano da GitHub UI.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test a secco: logga cosa pubblicherebbe, senza toccare Facebook/Instagram'
        type: boolean
        default: true
      force:
        description: 'Ignora il controllo giorno/ora (solo per test manuali)'
        type: boolean
        default: true
      fb_gia_pubblicato:
        description: 'Recupero: Facebook è già uscito (es. run finito male), non rifarlo e pubblica solo quel che manca'
        type: boolean
        default: false

# Un solo run alla volta: timer esterno e lancio manuale non devono mai girare in parallelo.
concurrency:
  group: pubblica-lunedi
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pubblica reminder della settimana
        env:
          DROPBOX_APP_KEY:        ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_REFRESH_TOKEN:  ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          FB_PAGE_ID:              ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN:   ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID:              ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:        ${{ secrets.IG_ACCESS_TOKEN }}
          # Cron (produzione): pubblica davvero. workflow_dispatch: rispetta l'input scelto.
          DRY_RUN:   ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          FB_GIA_PUBBLICATO: ${{ github.event_name == 'workflow_dispatch' && inputs.fb_gia_pubblicato || 'false' }}
        run: node pubblica-social.js
