/* ═══════════════════════════════════════════════
   ARCHIVIO FOTO
   Legge le foto dalla cartella Dropbox DROPBOX_PHOTO_FOLDER
   e dalle sue sottocartelle (categorie), mostra thumbnail
   via batch API, permette di associare una foto a ogni
   post del calendario e di filtrare per categoria.
═══════════════════════════════════════════════ */

let _photoCache = []; // cache locale per la sessione
let _photoCatMain = '';   // categoria attiva nella vista archivio
let _photoCatPicker = ''; // categoria attiva nel picker del post

// Estrae il nome della sottocartella (categoria) dal path di un file,
// relativo a DROPBOX_PHOTO_FOLDER. '' se il file è nella cartella radice.
function _photoCategoryOf(entry) {
  const rootLower = DROPBOX_PHOTO_FOLDER.toLowerCase().replace(/\/+$/, '') + '/';
  const rel = entry.path_lower.startsWith(rootLower) ? entry.path_lower.slice(rootLower.length) : entry.name.toLowerCase();
  const slashIdx = rel.lastIndexOf('/');
  return slashIdx > -1 ? rel.slice(0, slashIdx) : '';
}

// Lista i file immagine nella cartella foto su Dropbox e nelle sue sottocartelle,
// con relativa categoria (nome sottocartella). [] se cartella vuota, null se errore.
async function listDropboxPhotos() {
  const token = await getDropboxAccessToken();
  if (!token) return null;
  try {
    let entries = [];
    let data;
    let res = await fetch(`${DROPBOX_API}/files/list_folder`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: DROPBOX_PHOTO_FOLDER, recursive: true })
    });
    if (res.status === 409) return []; // cartella non ancora creata
    if (!res.ok) { const d = await res.json(); throw new Error(d.error_summary || `HTTP ${res.status}`); }
    data = await res.json();
    entries = entries.concat(data.entries);
    while (data.has_more) {
      res = await fetch(`${DROPBOX_API}/files/list_folder/continue`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ cursor: data.cursor })
      });
      if (!res.ok) { const d = await res.json(); throw new Error(d.error_summary || `HTTP ${res.status}`); }
      data = await res.json();
      entries = entries.concat(data.entries);
    }
    return entries
      .filter(e => e['.tag'] === 'file' && /\.(jpe?g|png|webp|gif|heic)$/i.test(e.name))
      .map(e => { e.category = _photoCategoryOf(e); return e; })
      .sort((a, b) => (a.category + a.name).localeCompare(b.category + b.name));
  } catch(e) { console.error('listDropboxPhotos:', e); return null; }
}

// Carica thumbnail in batch (max 25 per chiamata) e le inserisce negli <img data-photo-path>.
// size: risoluzione richiesta a Dropbox — 'w256h256' per le miniature in lista, 'w960h640'
// per l'anteprima grande nel dettaglio del post (vedi openPostDetail).
// Ritorna un array di errori (path + motivo) invece di fallire in silenzio: se Dropbox non
// trova un file (es. non ancora sincronizzato dal PC al cloud) prima si vedeva solo
// un'icona rotta senza spiegazione — ora chi chiama può mostrare il motivo reale a Luca.
async function loadPhotoThumbs(photos, gridId, size = 'w256h256') {
  const errors = [];
  const token = await getDropboxAccessToken();
  if (!token) { photos.forEach(p => errors.push({ path: p.path_lower, error: 'Dropbox non connesso' })); return errors; }
  if (!photos.length) return errors;
  const BATCH = 25;
  for (let i = 0; i < photos.length; i += BATCH) {
    const slice = photos.slice(i, i + BATCH);
    try {
      const res = await fetch(`${DROPBOX_CONTENT}/files/get_thumbnail_batch`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ entries: slice.map(p => ({ path: p.path_lower, format: 'jpeg', size, mode: 'bestfit' })) })
      });
      const data = await res.json();
      data.entries?.forEach((entry, j) => {
        const path = slice[j].path_lower;
        if (entry['.tag'] === 'success' && entry.thumbnail) {
          const img = document.querySelector(`#${gridId} [data-photo-path="${CSS.escape(path)}"]`);
          if (img) img.src = `data:image/jpeg;base64,${entry.thumbnail}`;
        } else {
          const reason = entry.failure?.[entry.failure?.['.tag']]?.['.tag'] || entry.failure?.['.tag'] || 'errore sconosciuto';
          console.warn('thumbnail non trovata:', path, entry.failure);
          errors.push({ path, error: reason });
        }
      });
    } catch(e) {
      console.error('thumbnail batch:', e);
      slice.forEach(p => errors.push({ path: p.path_lower, error: e.message }));
    }
  }
  return errors;
}

/* ═══════════════════════════════════════════════
   GRAFICA IG — foto + testo bold colorato + logo overlay (stile "Icche si
   fà?"), generata interamente lato client con Canvas 2D. Solo Instagram:
   Facebook resta foto pulita + caption lunga, il grid coerente conta solo
   sul feed IG. Colore diverso ogni settimana (rotazione fissa, stesso
   indice della foto — riproducibile, non casuale) su richiesta di Luca:
   il font "a bastoni" bianco/anonimo (Anton) non piaceva, voleva qualcosa
   di più giocoso/colorato ma senza scadere nel Comic Sans.
═══════════════════════════════════════════════ */
const IG_GRAPHIC_W = 1080, IG_GRAPHIC_H = 1350; // formato feed IG 4:5
const IG_LOGO_URL = 'https://raw.githubusercontent.com/shopilciliegio-ship-it/Ciliegio-Menu/main/ciliegio_trasparente.png';
// Frazione superiore del file logo occupata dal solo stemma dorato (il resto è la
// scritta "IL CILIEGIO AZIENDA AGRICOLA", illeggibile a scala badge — va ritagliata).
const IG_LOGO_ICON_CUT = 0.64;

// Palette settimanale: un colore diverso a rotazione (stesso indice della foto,
// non un colore a caso ad ogni generazione) — toni caldi coerenti col brand.
const IG_GRAPHIC_COLORS = [
  '#E8552F', // terracotta
  '#1D9E75', // verde Ciliegio
  '#BA7517', // ambra/oro
  '#993C1D', // vino/rame
  '#185FA5', // blu profondo
  '#C9302C', // rosso ciliegia
  '#534AB7', // viola
  '#0F6E56', // verde scuro
  '#D68910', // senape
  '#993556', // bordeaux/rosa scuro
];
function _coloreGraficaPerIndice(idx) {
  return IG_GRAPHIC_COLORS[((idx % IG_GRAPHIC_COLORS.length) + IG_GRAPHIC_COLORS.length) % IG_GRAPHIC_COLORS.length];
}

let _igLogoImg = null;
function _loadIgLogo() {
  if (_igLogoImg) return _igLogoImg;
  _igLogoImg = new Promise((resolve) => {
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => resolve(im);
    im.onerror = () => resolve(null); // logo non essenziale: se fallisce si genera comunque senza
    im.src = IG_LOGO_URL;
  });
  return _igLogoImg;
}

// Scarica il file immagine vero (non la thumbnail) da Dropbox come Blob.
async function downloadDropboxImageBlob(path) {
  const token = await getDropboxAccessToken();
  if (!token) throw new Error('Dropbox non connesso');
  const res = await fetch(`${DROPBOX_CONTENT}/files/download`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}`, 'Dropbox-API-Arg': JSON.stringify({ path }) }
  });
  if (!res.ok) {
    const text = await res.text();
    let msg = text; try { msg = JSON.parse(text).error_summary || text; } catch(e) {}
    throw new Error(`HTTP ${res.status}: ${msg}`);
  }
  return res.blob();
}

// Carica un Blob binario (es. la grafica IG generata) su Dropbox al path indicato,
// sovrascrivendo se già esiste. Variante binaria di saveToDropbox (che carica solo JSON).
async function uploadDropboxBlob(path, blob) {
  const token = await getDropboxAccessToken();
  if (!token) throw new Error('Dropbox non connesso');
  const res = await fetch(`${DROPBOX_CONTENT}/files/upload`, {
    method: 'POST',
    headers: {
      'Authorization':   `Bearer ${token}`,
      'Content-Type':    'application/octet-stream',
      'Dropbox-API-Arg': JSON.stringify({ path, mode: 'overwrite', autorename: false, mute: true })
    },
    body: blob
  });
  if (!res.ok) {
    const text = await res.text();
    let msg = text; try { msg = JSON.parse(text).error_summary || text; } catch(e) {}
    throw new Error(`HTTP ${res.status}: ${msg}`);
  }
}

// Scritta fissa in overlay su tutte le grafiche IG, uguale al claim usato nei testi
// FB/IG del reminder — non un titolo diverso per ogni foto (già deciso con Luca).
const IG_GRAPHIC_TITOLO = 'Ovvia mimmi!';

// Disegna la grafica IG (foto cover-fit + scrim + logo + titolo bold colorato
// con contorno scuro per leggibilità) su un canvas offscreen.
async function disegnaGraficaIG(photoBlob, titolo, colore) {
  // Il font va caricato ESPLICITAMENTE prima di scrivere sul canvas: fillText/strokeText
  // non aspettano un webfont non ancora pronto, cadono in silenzio sul font di sistema
  // senza errore (bug reale riscontrato: sembrava "il font sbagliato" ma era questo).
  await document.fonts.load('96px "Titan One"');
  await document.fonts.ready;

  const imgUrl = URL.createObjectURL(photoBlob);
  const img = await new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = () => reject(new Error('immagine non valida'));
    im.src = imgUrl;
  });
  const canvas = document.createElement('canvas');
  canvas.width = IG_GRAPHIC_W; canvas.height = IG_GRAPHIC_H;
  const ctx = canvas.getContext('2d');

  const scale = Math.max(IG_GRAPHIC_W / img.width, IG_GRAPHIC_H / img.height);
  const dw = img.width * scale, dh = img.height * scale;
  ctx.drawImage(img, (IG_GRAPHIC_W - dw) / 2, (IG_GRAPHIC_H - dh) / 2, dw, dh);
  URL.revokeObjectURL(imgUrl);

  // Scrim scuro graduale sul fondo, per leggibilità del testo su qualunque foto
  const grad = ctx.createLinearGradient(0, IG_GRAPHIC_H * 0.45, 0, IG_GRAPHIC_H);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.8)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, IG_GRAPHIC_H * 0.45, IG_GRAPHIC_W, IG_GRAPHIC_H * 0.55);

  // Logo in alto a destra, dentro un badge tondo — colorato con lo stesso colore
  // della scritta "Ovvia mimmi!" di questa settimana (mai bianco, su richiesta di
  // Luca). Il file originale ha anche la scritta "IL CILIEGIO AZIENDA AGRICOLA"
  // sotto lo stemma dorato: a scala badge sarebbe illeggibile, quindi qui si
  // ritaglia solo lo stemma (~64% superiore dell'immagine, vedi IG_LOGO_ICON_CUT).
  const logo = await _loadIgLogo();
  if (logo) {
    const badgeR = 90, badgeCx = IG_GRAPHIC_W - 64 - badgeR, badgeCy = 64 + badgeR;
    ctx.save();
    ctx.beginPath();
    ctx.arc(badgeCx, badgeCy, badgeR, 0, Math.PI * 2);
    ctx.fillStyle = colore;
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 16;
    ctx.fill();
    ctx.restore();
    // Lo stemma riempie quasi tutto il badge (piccolo margine perché non tocchi
    // il bordo del cerchio) — prima era troppo piccolo e "perso" nell'ovale.
    const sw = logo.width, sh = logo.height * IG_LOGO_ICON_CUT;
    const logoSize = badgeR * 1.88;
    const logoScale = Math.max(logoSize / sw, logoSize / sh);
    const lw = sw * logoScale, lh = sh * logoScale;
    ctx.save();
    ctx.beginPath();
    ctx.arc(badgeCx, badgeCy, badgeR, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(logo, 0, 0, sw, sh, badgeCx - lw / 2, badgeCy - lh / 2, lw, lh);
    ctx.restore();
  }

  // Titolo: font bold ed energico (Titan One, scelto da Luca), riempimento colorato
  // a rotazione settimanale, contorno scuro per restare leggibile su qualsiasi foto.
  // Dimensione e posizione SEMPRE UGUALI (solo il colore cambia a rotazione) — il
  // testo viene ridimensionato per occupare tutta la larghezza della foto, non ha
  // una dimensione fissa in px: una frase più lunga verrebbe scritta più piccola,
  // una più corta più grande, ma sempre da bordo a bordo.
  const pad = 64;
  const maxW = IG_GRAPHIC_W - pad * 2;
  const testo = titolo.toUpperCase();
  ctx.textBaseline = 'alphabetic';
  const refSize = 100;
  ctx.font = `${refSize}px "Titan One", sans-serif`;
  const measured = ctx.measureText(testo).width;
  const fontSize = Math.round(refSize * (maxW / measured));
  ctx.font = `${fontSize}px "Titan One", sans-serif`;

  const y = IG_GRAPHIC_H - pad - fontSize * 0.34; // "un attimo più alta" del bordo
  ctx.lineJoin = 'round';
  ctx.lineWidth = fontSize * 0.13;
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.strokeText(testo, pad, y);
  ctx.fillStyle = colore;
  ctx.fillText(testo, pad, y);

  return canvas;
}

// Genera e mostra in anteprima la grafica IG per un post (bottone nel dettaglio post).
// silent=true: usato per l'anteprima automatica all'apertura del post (niente toast di
// routine, solo in caso di errore reale) — il click manuale sul bottone resta "rumoroso".
async function generaGraficaIG(id, silent = false) {
  const found = findPostById(id);
  if (!found || !found.post.photoFile) return;
  const p = found.post;
  if (!silent) showToast('⏳ Genero la grafica...');
  try {
    const blob   = await downloadDropboxImageBlob(p.photoFile);
    const titolo = IG_GRAPHIC_TITOLO;
    // Indice per la rotazione colore: numero della foto se è un reminder (rotazione
    // fissa nota), altrimenti un indice stabile derivato dall'id del post.
    const rot = FOTO_ROTAZIONE.find(r => `${DROPBOX_PHOTO_FOLDER}/${r.file}`.toLowerCase() === p.photoFile);
    const idx = rot ? rot.numero : [...p.id].reduce((a,c) => a + c.charCodeAt(0), 0);
    const colore = _coloreGraficaPerIndice(idx);
    const canvas = await disegnaGraficaIG(blob, titolo, colore);
    const container = document.getElementById('ig-graphic-preview');
    if (!container) return;
    container.innerHTML = '';
    canvas.className = 'ig-graphic-canvas';
    container.appendChild(canvas);
    window._lastIgGraphicCanvas = canvas;
    if (!silent) showToast('✅ Grafica generata (anteprima, non ancora salvata)');
  } catch(err) {
    const container = document.getElementById('ig-graphic-preview');
    if (container) container.innerHTML = `<div style="font-size:12px; color:var(--coral); padding:10px">❌ Errore grafica: ${err.message}</div>`;
    showToast('❌ Errore grafica: ' + err.message);
    console.error(err);
  }
}

function scaricaGraficaIG() {
  if (!window._lastIgGraphicCanvas) { showToast('ℹ️ Genera prima la grafica'); return; }
  const a = document.createElement('a');
  a.href = window._lastIgGraphicCanvas.toDataURL('image/jpeg', 0.92);
  a.download = 'grafica-ig.jpg';
  a.click();
}

// Escape di una stringa per l'uso dentro un attributo onclick="..." con argomenti tra apici singoli.
function _jsAttr(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

function _photoCardHtml(photo, onclickJs) {
  const catLabel = photo.category ? photo.category.replace(/-/g, ' ') : '';
  return `<div class="photo-card" onclick="${onclickJs}">
    <img class="photo-thumb" data-photo-path="${photo.path_lower.replace(/"/g, '&quot;')}" src="" alt="">
    <div class="photo-card-name" title="${photo.name}">${catLabel ? `<span class="photo-card-cat">${catLabel}</span>` : ''}${photo.name}</div>
  </div>`;
}

// Genera i pulsanti filtro categoria a partire dall'elenco completo delle foto.
function _photoCatChips(allPhotos, activeCat, onclickFnName) {
  const cats = [...new Set(allPhotos.map(p => p.category).filter(Boolean))].sort();
  if (!cats.length) return '';
  const chip = (val, label) => `<button class="photo-cat-btn${activeCat === val ? ' active' : ''}" onclick="${onclickFnName}('${_jsAttr(val)}')">${label}</button>`;
  return `<div class="photo-cat-filters">
    ${chip('', 'Tutte')}
    ${cats.map(c => chip(c, c.replace(/-/g, ' '))).join('')}
  </div>`;
}

// Vista principale archivio foto
function renderPhotos() {
  if (!STATE.dropboxRefreshToken) {
    return `<div class="section-head"><div class="section-title">Archivio foto</div></div>
      <div class="photo-empty">
        <div class="photo-empty-icon">📦</div>
        <div>Connetti Dropbox in Impostazioni per accedere all'archivio foto.</div>
        <br><button class="btn primary" onclick="showView('settings')">⚙️ Impostazioni</button>
      </div>`;
  }
  setTimeout(loadAndRenderPhotos, 30);
  return `
    <div class="section-head">
      <div class="section-title">Archivio foto</div>
      <div style="font-size:12px; color:var(--text2)">Dropbox: <code>${DROPBOX_PHOTO_FOLDER}</code> (incluse sottocartelle)</div>
    </div>
    <div id="photos-main"><div class="photo-empty"><div class="photo-empty-icon">⏳</div>Caricamento da Dropbox...</div></div>
  `;
}

async function loadAndRenderPhotos() {
  const container = document.getElementById('photos-main');
  if (!container) return;
  const photos = await listDropboxPhotos();
  _photoCache = photos || [];
  if (photos === null) {
    container.innerHTML = `<div class="photo-empty"><div class="photo-empty-icon">❌</div>Errore caricamento — verifica la connessione Dropbox.</div>`;
    return;
  }
  if (!photos.length) {
    container.innerHTML = `<div class="photo-empty">
      <div class="photo-empty-icon">📭</div>
      <strong>Nessuna foto nell'archivio</strong><br><br>
      Carica le tue foto JPG/PNG su Dropbox nella cartella:<br>
      <code>${DROPBOX_PHOTO_FOLDER}</code><br><br>
      <small>Poi premi 🔄 Ricarica in alto a destra.</small>
    </div>`;
    return;
  }
  _photoCatMain = '';
  renderPhotosGrid();
}

// Ridisegna solo la griglia (dopo un cambio di filtro categoria), senza richiamare Dropbox.
function renderPhotosGrid() {
  const container = document.getElementById('photos-main');
  if (!container) return;
  const photos = _photoCatMain ? _photoCache.filter(p => p.category === _photoCatMain) : _photoCache;
  container.innerHTML = `
    ${_photoCatChips(_photoCache, _photoCatMain, 'setPhotoCatMain')}
    <div style="margin-bottom:14px; font-size:13px; color:var(--text2)">${photos.length} foto disponibili — clicca su un post nel calendario per associarne una</div>
    <div class="photo-grid" id="photos-grid-main">
      ${photos.map(p => _photoCardHtml(p, '')).join('')}
    </div>`;
  loadPhotoThumbs(photos, 'photos-grid-main');
}

function setPhotoCatMain(cat) {
  _photoCatMain = cat;
  renderPhotosGrid();
}

// Apre un modal per scegliere una foto da associare al post `postId`
async function openPhotoPicker(postId) {
  openModal('📷 Scegli una foto dall\'archivio', `<div id="picker-wrap"><div class="photo-empty"><div class="photo-empty-icon">⏳</div>Caricamento...</div></div>`);
  const photos = _photoCache.length ? _photoCache : await listDropboxPhotos();
  if (photos) _photoCache = photos;
  if (!photos || !photos.length) {
    const wrap = document.getElementById('picker-wrap');
    if (wrap) wrap.innerHTML = `<div class="photo-empty"><div class="photo-empty-icon">📭</div>
      Nessuna foto in <code>${DROPBOX_PHOTO_FOLDER}</code>.<br>Carica prima le foto su Dropbox.</div>`;
    return;
  }
  _photoCatPicker = '';
  renderPhotoPickerGrid(postId);
}

// Ridisegna solo la griglia del picker (dopo un cambio di filtro categoria).
function renderPhotoPickerGrid(postId) {
  const wrap = document.getElementById('picker-wrap');
  if (!wrap) return;
  const photos = _photoCatPicker ? _photoCache.filter(p => p.category === _photoCatPicker) : _photoCache;
  wrap.innerHTML = `
    ${_photoCatChips(_photoCache, _photoCatPicker, 'setPhotoCatPicker')}
    <div class="photo-grid" id="photos-grid-picker">
      ${photos.map(p => _photoCardHtml(p, `selectPhoto('${_jsAttr(postId)}', '${_jsAttr(p.path_lower)}')`)).join('')}
    </div>`;
  window._photoPickerPostId = postId;
  loadPhotoThumbs(photos, 'photos-grid-picker');
}

function setPhotoCatPicker(cat) {
  _photoCatPicker = cat;
  renderPhotoPickerGrid(window._photoPickerPostId);
}

function selectPhoto(postId, path) {
  const photo = _photoCache.find(p => p.path_lower === path);
  if (!photo) return;
  const found = findPostById(postId);
  if (!found) return;
  found.post.photoFile = photo.path_lower;
  found.post.photoName = photo.name;
  closeModalDirect();
  showToast(`📸 Foto associata: ${photo.name}`);
  openPostDetail(postId);
  autoSync();
}

function removePhoto(postId) {
  const found = findPostById(postId);
  if (!found) return;
  found.post.photoFile = '';
  found.post.photoName = '';
  openPostDetail(postId);
  autoSync();
}

/* ═══════════════════════════════════════════════
   DROPBOX SYNC
   Salva/carica piano.json su /IlCiliegio/SocialMedia/
   Autenticazione OAuth2 + PKCE (vedi sezione OAUTH più sotto)
═══════════════════════════════════════════════ */

async function saveToDropbox() {
  const token = await getDropboxAccessToken();
  if (!token) {
    showToast('⚠️ Connetti prima Dropbox in Impostazioni');
    showView('settings');
    return false;
  }
  try {
    showToast('⏳ Salvataggio su Dropbox...');
    const payload = {
      posts:              STATE.posts,
      recurringOverrides: extractRecurringOverrides(),
      settings:           STATE.settings,
      version:            APP_VERSION,
      lastSaved:          new Date().toISOString()
    };
    const response = await fetch(`${DROPBOX_CONTENT}/files/upload`, {
      method: 'POST',
      headers: {
        'Authorization':   `Bearer ${token}`,
        'Content-Type':    'application/octet-stream',
        'Dropbox-API-Arg': JSON.stringify({
          path: DROPBOX_FILE_PATH,
          mode: 'overwrite',
          autorename: false,
          mute: true
        })
      },
      body: JSON.stringify(payload, null, 2)
    });
    if (!response.ok) {
      const text = await response.text();
      let msg = text;
      try { msg = JSON.parse(text).error_summary || text; } catch(e) {}
      throw new Error(`HTTP ${response.status}: ${msg}`);
    }
    showToast('✅ Piano salvato su Dropbox!');
    return true;
  } catch(err) {
    showToast('❌ Errore Dropbox: ' + err.message);
    console.error(err);
    return false;
  }
}

async function loadFromDropbox() {
  const token = await getDropboxAccessToken();
  if (!token) {
    showToast('⚠️ Connetti prima Dropbox in Impostazioni');
    showView('settings');
    return false;
  }
  try {
    showToast('⏳ Caricamento da Dropbox...');
    const response = await fetch(`${DROPBOX_CONTENT}/files/download`, {
      method: 'POST',
      headers: {
        'Authorization':   `Bearer ${token}`,
        'Dropbox-API-Arg': JSON.stringify({ path: DROPBOX_FILE_PATH })
      }
    });
    if (response.status === 409) {
      // File non esiste ancora — salva quello corrente
      showToast('ℹ️ File non trovato su Dropbox — creo il piano iniziale...');
      await saveToDropbox();
      return true;
    }
    if (!response.ok) {
      const text = await response.text();
      let msg = text;
      try { msg = JSON.parse(text).error_summary || text; } catch(e) {}
      throw new Error(`HTTP ${response.status}: ${msg}`);
    }
    const data = await response.json();
    if (data.posts)    STATE.posts = data.posts;
    if (data.settings) Object.assign(STATE.settings, data.settings);
    applyRecurringOverrides(data.recurringOverrides || data.recurringPosts);
    const cleaned = removeLegacyPlaceholders();
    saveToStorage();
    if (cleaned) await saveToDropbox();
    await loadStoriesLog();
    await loadPostLog();
    applyPostLog();
    showView(STATE.currentView);
    showToast(`✅ Caricati ${STATE.posts.length} post da Dropbox!`);
    return true;
  } catch(err) {
    showToast('❌ Errore caricamento: ' + err.message);
    console.error(err);
    return false;
  }
}

// Chiamata automatica dopo ogni modifica se Dropbox è configurato
async function autoSync() {
  saveToStorage();
  if (STATE.dropboxRefreshToken) await saveToDropbox();
}

/* ═══════════════════════════════════════════════
   DROPBOX OAUTH2 + PKCE
   Flusso "Authorization Code with PKCE", senza app secret:
   1) connectDropbox()  apre la pagina di autorizzazione Dropbox
   2) Dropbox reindirizza qui con ?code=...
   3) handleDropboxRedirect() scambia il code per un access token
      + un refresh token (che non scade), salvato in localStorage
   4) getDropboxAccessToken() rinnova l'access token (~4h) on demand
═══════════════════════════════════════════════ */

function dropboxRedirectUri() {
  return location.origin + location.pathname;
}

function base64UrlEncode(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function randomPkceVerifier() {
  const arr = new Uint8Array(64);
  crypto.getRandomValues(arr);
  return base64UrlEncode(arr);
}

async function pkceChallenge(verifier) {
  const data = new TextEncoder().encode(verifier);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return base64UrlEncode(digest);
}

async function connectDropbox() {
  const appKey = STATE.dropboxAppKey;
  if (!appKey) {
    showToast('⚠️ Inserisci prima la App Key Dropbox');
    return;
  }
  const verifier = randomPkceVerifier();
  sessionStorage.setItem('dropbox_pkce_verifier', verifier);
  const challenge = await pkceChallenge(verifier);
  const params = new URLSearchParams({
    client_id: appKey,
    response_type: 'code',
    code_challenge: challenge,
    code_challenge_method: 'S256',
    token_access_type: 'offline',
    scope: 'files.content.write files.content.read files.metadata.read',
    redirect_uri: dropboxRedirectUri()
  });
  location.href = `${DROPBOX_AUTH_URL}?${params.toString()}`;
}

function disconnectDropbox() {
  STATE.dropboxRefreshToken = '';
  STATE.dropboxAccessToken = '';
  STATE.dropboxAccessTokenExpiry = 0;
  STATE.dropboxConnected = false;
  saveToStorage();
  updateDropboxStatus();
  showView('settings');
  showToast('📦 Dropbox disconnesso');
}

async function handleDropboxRedirect() {
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  if (!code) return;
  const verifier = sessionStorage.getItem('dropbox_pkce_verifier');
  sessionStorage.removeItem('dropbox_pkce_verifier');
  history.replaceState({}, '', dropboxRedirectUri());
  if (!verifier || !STATE.dropboxAppKey) {
    showToast('❌ Connessione Dropbox non riuscita: riprova da Impostazioni');
    return;
  }
  try {
    const response = await fetch(DROPBOX_TOKEN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        code,
        grant_type: 'authorization_code',
        client_id: STATE.dropboxAppKey,
        code_verifier: verifier,
        redirect_uri: dropboxRedirectUri()
      })
    });
    const data = await response.json();
    if (!response.ok || !data.refresh_token) {
      throw new Error(data.error_description || data.error || 'risposta inattesa da Dropbox');
    }
    STATE.dropboxRefreshToken = data.refresh_token;
    STATE.dropboxAccessToken = data.access_token;
    STATE.dropboxAccessTokenExpiry = Date.now() + (data.expires_in * 1000) - 60000;
    STATE.dropboxConnected = true;
    saveToStorage();
    showToast('✅ Dropbox connesso!');
  } catch(err) {
    showToast('❌ Errore connessione Dropbox: ' + err.message);
    console.error(err);
  }
}

// Ritorna un access token valido, rinnovandolo tramite il refresh token se necessario
async function getDropboxAccessToken() {
  if (!STATE.dropboxRefreshToken) return null;
  if (STATE.dropboxAccessToken && Date.now() < STATE.dropboxAccessTokenExpiry) {
    return STATE.dropboxAccessToken;
  }
  try {
    const response = await fetch(DROPBOX_TOKEN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type: 'refresh_token',
        refresh_token: STATE.dropboxRefreshToken,
        client_id: STATE.dropboxAppKey
      })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error_description || data.error || 'refresh token fallito');
    STATE.dropboxAccessToken = data.access_token;
    STATE.dropboxAccessTokenExpiry = Date.now() + (data.expires_in * 1000) - 60000;
    saveToStorage();
    return STATE.dropboxAccessToken;
  } catch(err) {
    showToast('❌ Sessione Dropbox scaduta, riconnetti in Impostazioni: ' + err.message);
    console.error(err);
    STATE.dropboxRefreshToken = '';
    STATE.dropboxConnected = false;
    saveToStorage();
    return null;
  }
}

/* ═══════════════════════════════════════════════
   MODAL UTILS
═══════════════════════════════════════════════ */
function openModal(title, bodyHTML) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  document.getElementById('modal').style.display = 'flex';
}

function closeModal(e) {
  if (e.target === document.getElementById('modal')) closeModalDirect();
}

function closeModalDirect() {
  document.getElementById('modal').style.display = 'none';
}

/* ═══════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════ */
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
